name: Publish to CodeMC

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

# 必须声明 environment,才能读取 Deploy 环境下的 secrets / variables
jobs:
  publish:
    environment: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to CodeMC Nexus
        env:
          # 优先读环境 secret,为空则回退到环境 variable(兼容两种添加方式)
          GRADLE_PROJECT_MAVEN_USERNAME: ${{ secrets.CODEMC_USERNAME != '' && secrets.CODEMC_USERNAME || vars.CODEMC_USERNAME }}
          GRADLE_PROJECT_MAVEN_PASSWORD: ${{ secrets.CODEMC_PASSWORD != '' && secrets.CODEMC_PASSWORD || vars.CODEMC_PASSWORD }}
        run: >-
          ./gradlew clean publish
          -PcodemcUsername=${{ secrets.CODEMC_USERNAME != '' && secrets.CODEMC_USERNAME || vars.CODEMC_USERNAME }}
          ${{
            github.ref_type == 'tag' &&
            format('-PprojectVersion={0}', github.ref_name) || ''
          }}
